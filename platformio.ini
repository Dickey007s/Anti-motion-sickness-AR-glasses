; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino

; ============================================
; 上传端口配置（Windows）
; ============================================
; 查看当前开发板端口号：
;   1. 右键"此电脑" -> 管理 -> 设备管理器
;   2. 展开"端口(COM 和 LPT)"
;   3. 找到名称含 "USB-SERIAL" / "Silicon Labs" / "CH340" 的设备
;   4. 记录对应的 COM 号（如 COM3）
;
; 填入下方 upload_port（去掉前面的分号注释）：
; upload_port = COM3
;
; 或者不指定，让 PlatformIO 自动检测（推荐先试自动）
; upload_port = AUTO
; ============================================
upload_port = COM13
; 上传波特率（默认 921600，若上传不稳定可降为 460800）
upload_speed = 921600

; Flash 大小修正：该板实际为 4MB，board 定义误写 8MB
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; 监控串口波特率（与代码中 Serial.begin() 一致）
monitor_speed = 115200

; ST7789V 屏幕驱动库
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.5.0

; TFT_eSPI 配置：使用项目本地的 setup 文件，避免修改库目录下的 User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED
    -include "include/TFT_Setup.h"
    -DBOARD_HAS_PSRAM

